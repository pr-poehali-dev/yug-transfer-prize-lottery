# /etc/nginx/sites-available/baza  (затем: ln -s ../sites-available/baza /etc/nginx/sites-enabled/)
server {
    listen 80;
    server_name baza-info.online www.baza-info.online;

    root /opt/baza/dist;
    index index.html;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # Фото: если храните их в MinIO на этом же сервере (бакет files, публичное чтение)
    location /files/ {
        proxy_pass http://127.0.0.1:9000/files/;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
